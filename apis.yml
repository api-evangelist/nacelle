    type: APIReference
  - url: graphql/nacelle-graphql.md
    type: GraphQL
  - url: graphql/nacelle-schema.graphql
    type: GraphQL
  - url: collections/nacelle.postman_collection.json
    type: PostmanCollection
  - url: collections/nacelle.opencollection.json
    type: OpenCollection
  description: >-
    The `allProducts` query on Nacelle's Storefront GraphQL API returns normalized product entries (variants,
    pricing, media, metafields) drawn from ingested Shopify or other commerce sources, with Relay-style
    pagination by handle or nacelleEntryId.
