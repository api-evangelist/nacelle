name: Nacelle

kind: company

description: Nacelle is a headless / composable commerce data platform that ingests, normalizes, and indexes commerce and content data (Shopify,
  Contentful and other CMS sources) and serves it back to headless storefronts through a single, fast GraphQL Storefront API. The company has
  since pivoted toward an AI personalization engine, and the headless commerce Storefront API is now a legacy / maintenance-mode product rather
  than an actively expanding platform.

