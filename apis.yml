    type: GraphQL
  - url: collections/nacelle.postman_collection.json
    type: PostmanCollection
  - url: collections/nacelle.opencollection.json
    type: OpenCollection
  description: >-
    The Admin GraphQL API triggers and monitors the indexing / ingestion pipeline that pulls data from
    connected sources (Shopify, CMS) into a space - starting or resetting index jobs for a data source,
    entry, or entry type, and querying indexing status. Documented as a beta / limited-availability feature
    and authenticated with an admin token.
