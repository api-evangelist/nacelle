aid: nacelle
url: https://raw.githubusercontent.com/api-evangelist/nacelle/refs/heads/main/apis.yml
name: Nacelle
kind: company
description: Nacelle is a headless / composable commerce data platform that ingests,
  normalizes, and indexes commerce and content data (Shopify, Contentful and other
  CMS sources) and serves it back to headless storefronts through a single, fast
  GraphQL Storefront API. The company has since pivoted toward an AI personalization
  engine, and the headless commerce Storefront API is now a legacy / maintenance-mode
  product rather than an actively expanding platform.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Commerce
- Headless Commerce
- Composable Commerce
- GraphQL
- Content
- Data Indexing
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'
