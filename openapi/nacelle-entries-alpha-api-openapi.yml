openapi: 3.2.0
info:
  title: Ingest entries (ALPHA) API
  version: 1.0.0
  description: This is the documentation for the Ingest API.
servers:
- url: https://ingest.api.nacelle.com/v1/
  description: Ingest API Development server
tags:
- name: entries (ALPHA)
paths:
  /inventory-item:
    put:
      tags:
      - entries (ALPHA)
      summary: inventory-item (ALPHA)
      description: 'The _**inventory-item**_ endpoint adds inventory items to an index.


        * **NOTE: versioning is NOT supported in inventory items ALPHA, so passing an indexId will cause ingest to fail. Additionally, non-versioned inventory-item data is only compatible with non-versioned product-variant data.**


        * **NOTE: access to the inventory items API is given to select spaces in inventory items ALPHA.**


        The only required fields are `sourceEntryId` and `sourceVariantId`.'
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourceVariantId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sourceVariantId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sku:
                        type: string
                        example: XYZ12345
                      key:
                        type: string
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      metafields:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/metafields'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    message: 'INVENTORY_ITEM UPDATE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '403':
          description: Forbidden
          content:
            application/json:
              examples:
                SourceNotFoundExample:
                  summary: Feature not available. Please read the documentation for more information.
                  value:
                    message: This feature is not available yet for source with id 00000000-0000-0000-0000-000000000000
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
      operationId: putInventoryItem
      x-operation-id-source: derived
    delete:
      tags:
      - entries (ALPHA)
      summary: inventory-item (ALPHA)
      description: 'The _**delete inventory-item**_ endpoint deletes inventory items from an index.


        The only required field is `sourceEntryId`.'
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                IndexCleared:
                  summary: Success
                  value:
                    message: 'INVENTORY_ITEM DELETE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '403':
          $ref: '#/paths/~1inventory-item/put/responses/403'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
      operationId: deleteInventoryItem
      x-operation-id-source: derived
