        * **NOTE: versioning is NOT supported in inventory levels ALPHA, so passing an indexId will cause ingest to fail. Additionally, non-versioned inventory-level data is only compatible with non-versioned product-variant data.**


        * **NOTE: access to the inventory levels API is given to select spaces in inventory levels ALPHA.**


        The only required fields are `sourceEntryId`, `sourceInventoryItemId`, and `sourceInventoryLocationId`.'
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourceInventoryItemId
                    - sourceInventoryLocationId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sourceInventoryItemId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sourceInventoryLocationId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      quantityAvailable:
                        type: number
                        example: 5
                      availableForPickup:
                        type: boolean
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      metafields:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/metafields'
      responses:
        '200':
          description: Success
          content:
            application/json:
