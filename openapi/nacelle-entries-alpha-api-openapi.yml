  /inventory-location:
    put:
      tags:
      - entries (ALPHA)
      summary: inventory-location (ALPHA)
      description: 'The _**inventory-location**_ endpoint adds inventory locations to an index.


        * **NOTE: versioning is NOT supported in inventory locations ALPHA, so passing an indexId will cause ingest to fail. Additionally, non-versioned inventory-location data is only compatible with non-versioned product-variant data.**


        * **NOTE: access to the inventory locations API is given to select spaces in inventory locations ALPHA.**


        The only required field is `sourceEntryId`.'
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      name:
                        type: string
                      address1:
                        type: string
                      address2:
                        type: string
                      city:
                        type: string
                      region:
                        type: string
                      regionCode:
                        type: string
                      country:
                        type: string
                      countryCode:
                        type: string
                      postalCode:
                        type: string
                      phone:
                        type: string
                      coordinates:
                        type: object
                        required:
                        - latitude
                        - longitude
                        properties:
                          latitude:
                            type: number
                            example: 35.89421911
                          longitude:
                            type: number
                            example: 139.94637467
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
