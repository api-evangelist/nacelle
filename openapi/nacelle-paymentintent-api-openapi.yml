openapi: 3.2.0
info:
  description: The Order Management API is used to manage orders in the Nacelle Order Management System. This API is currently experimental and is subject to change.
  title: Order Management API (Experimental) Paymentintent API
  version: 0.1.0
servers:
- url: https://noms.api.nacelle.com/api/v1
security:
- oauth2: []
tags:
- name: paymentintent
paths:
  /paymentintent/create:
    post:
      description: This will create a payment intent on the input parameters.
      operationId: createPaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Create a paymentintent
      tags:
      - paymentintent
  /paymentintent/{payment-intent-id}/capture:
    patch:
      description: This will capture a specific amount from a payment intent based on the input parameters.
      operationId: capturePaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: payment-intent-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Capture a payment
      tags:
      - paymentintent
  /paymentintent/{payment-intent-id}/refund:
    patch:
      description: This will refund a payment intent based on the input parameters.
      operationId: refundPaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: payment-intent-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Refund a payment
      tags:
      - paymentintent
  /paymentintent/{payment-intent-id}/retrieve:
    get:
      description: This will retrieve a paymentintent from stripe based on the input parameters.
      operationId: retrievePaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: payment-intent-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Retrieve a paymentintent
      tags:
      - paymentintent
  /paymentintent/{payment-intent-id}/update:
    patch:
      description: This will update a payment intent based on the input parameters.
      operationId: updatePaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: payment-intent-id
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Update a payment
      tags:
      - paymentintent
