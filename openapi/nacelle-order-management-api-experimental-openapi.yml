openapi: 3.0.0
info:
  description: 'The Order Management API is used to manage orders in the Nacelle Order Management System. This API is currently experimental and is subject to change.

    '
  title: Order Management API (Experimental)
  version: 0.1.0
security:
- oauth2: []
servers:
- url: https://noms.api.nacelle.com/api/v1
paths:
  /addresses/{nacelle-address-id}:
    patch:
      description: This will update an address based on the input parameters.
      operationId: updateAddress
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: nacelle-address-id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      summary: Update an address
      tags:
      - addresses
  /checkout/validate:
    post:
      description: This will validate and return an order-checkout based on the input parameters.
      operationId: validateCheckout
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCheckout'
        required: true
      responses:
        '201':
          description: OrderCheckout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCheckout'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      summary: Validates an order-checkout request.
      tags:
      - checkout
  /customers:
    post:
      description: This will create a customer based on the input parameters.
      operationId: createCustomer
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
