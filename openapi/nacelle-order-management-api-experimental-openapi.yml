      tags:
      - paymentintent
  /paymentintent/{payment-intent-id}/capture:
    patch:
      description: This will capture a specific amount from a payment intent based on the input parameters.
      operationId: capturePaymentIntent
      parameters:
      - in: header
        name: X-Nacelle-Space-ID
        required: true
        schema:
          type: string
      - in: path
        name: payment-intent-id
        required: true
