        access_token:
          description: The access token that can be used for authenticated requests.
          example: your_access_token_here
          type: string
          x-go-name: AccessToken
        expires_in:
          description: The duration in seconds for which the access token is valid.
          example: 3600
          format: int64
          type: integer
          x-go-name: ExpiresIn
      title: Token represents the structure of an access token.
      type: object
      x-go-package: github.com/getnacelle/authimilate/services/auth0-mgmt/pkg/model
    TokenRequest:
      properties:
        audience:
