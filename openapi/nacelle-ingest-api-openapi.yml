  /pricing:
    put:
      tags:
      - entries (BETA)
      summary: pricing (BETA)
      description: "The _**pricing**_ endpoint adds pricings to an index.\n\n* If an `indexId` field is present, the entries will be added to that index.\n\n* If an `indexId` is not specified the entries will be added to the current active index,\n  and all in progress indexes for the specified `sourceId`.\n\n* An `entryTypeSourceIdMap` may be specified if the `sourceVariantId` points to a data connector from a different source, such as Shopify.\n  * The key being `PRODUCT_VARIANT` and the value being the Nacelle source ID for the Shopify data connector found in the dashboard.\n  * See the [**Standalone Price Books with Shopify Guide**](https://docs.nacelle.com/docs/standalone-price-books-shopify) for details.\n\n* An entry may contain `sourceSegmentId`. This will allow multiple versions of a variant pricing for different segments or customer groups.\n  * This should NOT be used by default, because pricings will not be queryable without a customer auth token pointing towards the given `sourceSegmentId`.\n\
        \  * See the [**Standalone Price Books for B2B Guide**](https://docs.nacelle.com/docs/standalone-price-books-b2b) for details.\n\nRequired fields are `sourceEntryId`, `sourcePriceBookId`, and `sourceVariantId`.\n"
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexId:
                  type: string
                  required: false
                  example: 00000000-0000-0000-0000-000000000000
                entryTypeSourceIdMap:
                  required: false
                  type: object
                  properties:
                    PRODUCT_VARIANT:
                      type: string
                      required: false
                      example: 00000000-0000-0000-0000-000000000000
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourcePriceBookId
                    - sourceVariantId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sourcePriceBookId:
                        type: string
                        example: 2855f62230ac3c915f300c664312c62g
                      sourceVariantId:
                        type: string
                        example: gid://shopify/Variant/0000000000000
                      sourceSegmentId:
                        type: string
                        example: vip-members
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      metafields:
                        type: array
                        example:
                        - id: metafieldId
                          namespace: metafieldNamespace
                          key: metafieldKey
                          value: metafieldValue
                        required:
                        - key
                        - value
                        items:
                          type: object
                          required:
                          - key
                          - value
                          properties:
                            key:
                              type: string
                            value:
                              type: string
                            id:
                              type: string
                            namespace:
                              type: string
                      price:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/msrp'
                      shipping:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/msrp'
                      taxValue:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/msrp'
                      strikethroughPrice:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/msrp'
                      sourceCountryCode:
                        type: string
                        example: US
                        minLength: 2
                        maxLength: 2
                      compareAtPrice:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/msrp'
                      msrp:
                        type: object
                        required:
                        - amount
                        - currencyCode
                        properties:
                          amount:
                            type: integer
                            example: 12099
                          currencyCode:
                            type: string
                            example: USD
                          precisionDigits:
                            type: integer
                            example: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    message: 'pricing UPDATE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
    delete:
      tags:
      - entries (BETA)
      summary: pricing (BETA)
      description: 'The `DELETE` _**pricing**_ endpoint deletes pricing entries from the

        current active index, and all in progress indexes.


        Required fields are `sourceEntryId`.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
