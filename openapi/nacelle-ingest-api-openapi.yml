openapi: 3.1.0
info:
  title: Ingest API
  version: 1.0.0
  description: This is the documentation for the Ingest API.
servers:
- url: https://ingest.api.nacelle.com/v1/
  description: Ingest API Development server
paths:
  /collection:
    put:
      tags:
      - entries
      summary: collection
      description: "The _**collection**_ endpoint adds collection entries to an index.\n\n* If an `indexId` field is present, the entries will be added to that index.\n\n* If an `indexId` is not specified the entries will be added to the current active index,\n  and all in progress indexes for the specified `sourceId`.\n\nThe required fields are `sourceEntryId`, `collectionType` and `items`.\n"
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexId:
                  type: string
                  required: false
                  example: 00000000-0000-0000-0000-000000000000
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - collectionType
                    - items
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
                      items:
                        type: array
                        example:
                        - '1234'
                        items:
                          type: string
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      metafields:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/metafields'
                      tags:
                        $ref: '#/paths/~1product/put/requestBody/content/application~1json/schema/properties/entries/items/properties/tags'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                CollectionCreated:
                  summary: Success
                  value:
                    message: 'COLLECTION UPDATE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
    delete:
      tags:
      - entries
      summary: collection
      description: 'The _**delete collection**_ endpoint deletes collection entries from the currently active index.


        The required fields are `sourceEntryId`, `collectionType` and `items`.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - collectionType
                    - items
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
                      items:
                        type: array
                        example:
                        - '1234'
                        items:
                          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                IndexCleared:
                  summary: Success
                  value:
                    message: 'COLLECTION DELETE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /collection-content:
    put:
      tags:
      - entries
      summary: collection content
      description: "The `PUT` _**collection-content**_ endpoint adds collection content entries to an index.\n\n* If an `indexId` field is present, the entries will be added to that index.\n\n* If an `indexId` is not specified the entries will be added to the current active index,\n  and all in progress indexes for the specified `sourceId`.\n\nRequired fields are `sourceEntryId` and `sourceCollectionId`.\n"
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexId:
                  type: string
                  required: false
                  example: 00000000-0000-0000-0000-000000000000
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourceCollectionId
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
                      sourceCollectionId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      title:
                        type: string
                        example: My Content Title
                      handle:
                        type: string
                        example: contentHandle
                      description:
                        type: string
                        example: My Content Description
                      locale:
                        type: string
                        example: en-US
                      published:
                        type: boolean
                        example: true
                      fields:
                        type: object
                        example:
                          foo: bar
                      seo:
                        $ref: '#/paths/~1product-content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/seo'
                      metafields:
                        $ref: '#/paths/~1pricing/put/requestBody/content/application~1json/schema/properties/entries/items/properties/metafields'
                      featuredMedia:
                        $ref: '#/paths/~1product-content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/featuredMedia'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                IndexCleared:
                  summary: Success
                  value:
                    message: 'COLLECTION_CONTENT UPDATE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
    delete:
      tags:
      - entries
      summary: collection content
      description: 'The `DELETE` _**collection-content**_ endpoint deletes collection content entries from the

        current active index, and all in progress indexes.


        Required fields are `sourceEntryId` and `sourceCollectionId`.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourceCollectionId
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
                      sourceCollectionId:
                        type: string
                        example: gid://shopify/Collection/0000000000000
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    message: 'COLLECTION_CONTENT DELETE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /content:
    put:
      tags:
      - entries
      summary: content
      description: "The `PUT` _**content**_ endpoint adds content entries to an index.\n\n* If an `indexId` field is present, the entries will be added to that index.\n\n* If an `indexId` is not specified the entries will be added to the current active index,\n  and all in progress indexes for the specified `sourceId`.\n\nRequired fields are `sourceEntryId`.\n"
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexId:
                  type: string
                  required: false
                  example: 00000000-0000-0000-0000-000000000000
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Product/0000000000000
                      locale:
                        type: string
                        example: en-US
                      title:
                        type: string
                        example: My Content Title
                      published:
                        type: boolean
                      type:
                        type: string
                        example: blog
                      handle:
                        type: string
                        example: contentHandle
                      createdAt:
                        type: string
                        format: date-time (ISO 8601 UTC)
                        example: '2023-09-16T00:00:00'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      fields:
                        type: string
                        example: '{ "foo": "bar" }'
                        description: A json encoded string of custom ingestion data
                      isTopLevel:
                        type: boolean
                        example: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                IndexCleared:
                  summary: Success
                  value:
                    message: 'CONTENT UPDATE: success'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                BadRequestNoSourceEntryIdExample:
                  summary: Bad Request (no sourceEntryId)
                  value:
                    error: Bad Request
                    message: Bad Request
                    errors:
                    - sourceEntryId: null
                      errors:
                      - target:
                          locale: en-US
                        property: sourceEntryId
                        children: []
                        constraints:
                          maxLength: sourceEntryId must be shorter than or equal to 128 characters
                          isString: sourceEntryId must be a string
                BadRequestSourceEntryIdTooLongExample:
                  summary: Bad Request (sourceEntryId too long)
                  value:
                    error: Bad Request
                    message: Bad Request
                    errors:
                    - sourceEntryId: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
                      errors:
                      - target:
                          locale: en-US
                          sourceEntryId: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
                        value: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz
                        property: sourceEntryId
                        children: []
                        constraints:
                          maxLength: sourceEntryId must be shorter than or equal to 128 characters
                BadRequestSourceEntryIdNotAStringExample:
                  summary: Bad Request (sourceEntryId is not a string)
                  value:
                    error: Bad Request
                    message: Bad Request
                    errors:
                    - sourceEntryId: 12345
                      errors:
                      - target:
                          locale: en-US
                          sourceEntryId: 12345
                        value: 12345
                        property: sourceEntryId
                        children: []
                        constraints:
                          maxLength: sourceEntryId must be shorter than or equal to 128 characters
                          isString: sourceEntryId must be a string
        '404':
          description: Not found
          content:
            application/json:
              examples:
                SourceNotFoundExample:
                  summary: Source Not Found
                  value:
                    message: Source with id 00000000-0000-0000-0000-000000000000 not found
        '409':
          description: Conflict
          content:
            application/json:
              examples:
                IndexNotInProgress:
                  summary: 'Conflict: index not in progress'
                  value:
                    error: Conflict
                    reason: The provided index id is invalid. No index in progress was found for the given index id.
                EntryTypeNotIncludedInIndex:
                  summary: 'Conflict: entry types'
                  value:
                    error: Conflict
                    reason: 'The provided index id can only accept entries of types: CONTENT, PRODUCT'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
    delete:
      tags:
      - entries
      summary: content
      description: 'The `DELETE` _**content**_ endpoint deletes content entries from the

        current active index, and all in progress indexes.


        Required fields are `sourceEntryId`.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    properties:
                      sourceEntryId:
                        type: string
                        example: gid://shopify/Product/0000000000000
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    message: 'CONTENT DELETE: success'
        '400':
          $ref: '#/paths/~1content/put/responses/400'
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /custom-schema:
    put:
      tags:
      - entries (BETA)
      summary: custom schema (BETA)
      description: "The _**custom schema**_ endpoint updates a schema for an index.\n\n* If an `indexId` field is present, the schema will be added to that index.\n\n* If an `indexId` is not specified the schema will be added to the current active index,\n  and all in progress indexes for the specified `sourceId`.\n\nThe required fields are `schema` and `normalizationPrefix`.\n"
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                indexId:
                  type: string
                  required: false
                  example: 00000000-0000-0000-0000-000000000000
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - schema
                    - normalizationPrefix
                    properties:
                      schema:
                        type: string
                        example: 'type NacelleProduct { title: String collection: NacelleCollection} type NacelleCollection { name: String products: [NacelleProduct]}'
                      normalizationPrefix:
                        type: string
                        example: Nacelle
                      createdAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
                      updatedAt:
                        $ref: '#/paths/~1content/put/requestBody/content/application~1json/schema/properties/entries/items/properties/createdAt'
      responses:
        '200':
          description: Success
          content:
            application/json:
              examples:
                CustomSchemaUpdated:
                  summary: Success
                  value:
                    message: 'CUSTOM_SCHEMA UPDATE: success'
        '400':
          description: Bad Request
          content:
            application/json:
              examples:
                BadRequestNoSchemaExample:
                  summary: Bad Request (no schema)
                  value:
                    error: Bad Request
                    message: Bad Request
                    errors:
                    - schema: null
                      errors:
                      - target: null
                        property: schema
                        children: []
                        constraints:
                          isString: schema must be a string
        '404':
          $ref: '#/paths/~1content/put/responses/404'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /index:
    get:
      tags:
      - index
      summary: Read indexes status
      description: 'The _**index**_ endpoint allows checking the status of indexes for a given source.


        When errors occur during index processing, details may be provided via the `errors` field.

        '
      parameters:
      - name: x-nacelle-space-id
        in: header
        description: The unique identifier of the Nacelle space
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000000
      - name: x-nacelle-source-id
        in: header
        description: The unique identifier of the source within the space
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000000
      - name: x-nacelle-ingest-token
        in: header
        description: The authentication token for Nacelle Ingest
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Index statuses
          content:
            application/json:
              examples:
                IndexStatuses:
                  summary: Index Statuses listed
                  value:
                  - indexId: 00000000-0000-0000-0000-000000000000
                    sourceId: 00000000-0000-0000-0000-000000000000
                    status: index_complete
                    numEntriesCreated: 100
                    indexVersion: 1
                    createdAt: '2023-09-16T00:00:00'
                    updatedAt: '2023-09-16T00:00:00'
                    entryTypes:
                    - PRODUCT
                    - PRODUCT_CONTENT
                    - PRODUCT_VARIANT
                    - PRODUCT_VARIANT_CONTENT
                    - CONTENT
                    - COLLECTION
                    - COLLECTION_CONTENT
                    - PRICE_BOOK
                    - PRICING
                    - CUSTOM_SCHEMA
                    errors: null
        '404':
          description: Not found
          content:
            application/json:
              examples:
                NotFoundExample:
                  summary: Not Found
                  value:
                    reason: Source not found.
        '500':
          description: Internal Error
          content:
            application/json:
              examples:
                InternalErrorExample:
                  summary: Internal Error
                  value:
                    error: Internal Error
                    reason: An internal error occurred. Please read https://docs.getnacelle.com/ for more information.
    post:
      tags:
      - index
      summary: Start an index
      description: 'The _**start**_ endpoint allows to start an index for specific `entryTypes`.

        If successful, the response will contain an `indexId` which can subsequently

        be used to ingest entries, finish or cancel the index.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            examples:
              test:
                summary: Start an index for PRODUCT and CONTENT entry types
                value:
                  entryTypes:
                  - PRODUCT
                  - CONTENT
            schema:
              type: object
              properties:
                entryTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - COLLECTION
                    - COLLECTION_CONTENT
                    - CONTENT
                    - PRICE_BOOK
                    - PRICING
                    - PRODUCT
                    - PRODUCT_CONTENT
                    - PRODUCT_VARIANT
                    - PRODUCT_VARIANT_CONTENT
                    - CUSTOM_SCHEMA
      responses:
        '200':
          description: Index Created
          content:
            application/json:
              examples:
                IndexCreated:
                  summary: Index Created
                  value:
                    message: Index Created
                    indexId: 00000000-0000-0000-0000-000000000000
        '400':
          description: Bad request
          content:
            application/json:
              examples:
                BadRequestExample:
                  summary: Bad Request
                  value:
                    error: Bad Request
                    errors:
                    - target: {}
                      property: entryTypes
                      children: []
                      constraints:
                        arrayMinSize: entryTypes must contain at least 1 elements
                        isArray: entryTypes must be an array
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /index/cancel:
    post:
      tags:
      - index
      summary: Cancel all running indexes for a source
      description: 'The _**cancel**_ endpoint allows to cancel all in-flight indexes for the given sourceId header.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      responses:
        '200':
          description: Index cancelled
          content:
            application/json:
              examples:
                IndexCancelled:
                  summary: Index cancelled
                  value:
                    message: Index cancelled
        '304':
          description: Not modified
          content:
            application/json:
              examples:
                NotFoundExample:
                  summary: Not Modified
                  value:
                    message: No indexes to cancel
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /index/clear:
    post:
      tags:
      - index
      summary: Clear all entries of specified entry types
      description: 'The _**clear**_ endpoint allows you to remove all entries of specified `entryType`s for a source in a Nacelle space.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entryTypes:
                  type: array
                  items:
                    $ref: '#/paths/~1index/post/requestBody/content/application~1json/schema/properties/entryTypes/items'
      responses:
        '200':
          description: Index cleared
          content:
            application/json:
              examples:
                IndexCleared:
                  summary: Index cleared
                  value:
                    message: Index cleared
        '400':
          $ref: '#/paths/~1index/post/responses/400'
        '404':
          $ref: '#/paths/~1index/get/responses/404'
        '409':
          description: Conflict
          content:
            application/json:
              examples:
                ConflictExample:
                  summary: Conflict Error
                  value:
                    error: Conflict
                    reason: Cannot clear index that is in progress. Please read https://docs.getnacelle.com/ for more information.
                    incompleteIndex:
                      indexId: 49f0352a-e1ab-40f7-9385-2876b696fdd8
                      sourceId: 150e2b3a-5699-42ed-9389-d386b0b5fa5a
                      status: in_progress
                      numEntriesCreated: 0
                      entryTypes:
                      - CONTENT
                      indexVersion: 14
                      createdAt: '2023-09-27T14:29:12.033Z'
                      updatedAt: '2023-09-27T14:29:12.033Z'
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /index/{indexId}/finish:
    post:
      tags:
      - index
      summary: Finishes an index
      description: 'The _**finish**_ endpoint completes an index, signaling Nacelle to promote

        it to the current active index and trigger deletion of the previous active

        index once internal processing has completed.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      - name: indexId
        in: path
        description: The ID of the index
        required: true
        schema:
          type: string
          example: 00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Index Finished
          content:
            application/json:
              examples:
                IndexFinished:
                  summary: Index Finished
                  value:
                    message: Index Finished
        '404':
          description: Not found
          content:
            application/json:
              examples:
                SourceNotFoundExample:
                  summary: Source Not Found
                  value:
                    reason: Source not found.
                IndexNotFoundExample:
                  summary: Index Not Found
                  value:
                    reason: Index not found.
        '409':
          description: Conflict
          content:
            application/json:
              examples:
                ConflictExample:
                  summary: Conflict Error
                  value:
                    error: Conflict
                    reason: Index is not in progress.
        '500':
          $ref: '#/paths/~1index/get/responses/500'
  /inventory-item:
    put:
      tags:
      - entries (ALPHA)
      summary: inventory-item (ALPHA)
      description: 'The _**inventory-item**_ endpoint adds inventory items to an index.


        * **NOTE: versioning is NOT supported in inventory items ALPHA, so passing an indexId will cause ingest to fail. Additionally, non-versioned inventory-item data is only compatible with non-versioned product-variant data.**


        * **NOTE: access to the inventory items API is given to select spaces in inventory items ALPHA.**


        The only required fields are `sourceEntryId` and `sourceVariantId`.

        '
      parameters:
      - $ref: '#/paths/~1index/get/parameters/0'
      - $ref: '#/paths/~1index/get/parameters/1'
      - $ref: '#/paths/~1index/get/parameters/2'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required:
                    - sourceEntryId
                    - sourceVariantId
                    properties:
                      sourceEntryId:
                        type: string
                        example: 3858f62230ac3c915f300c664312c63f
                      sourceVariantId:
                        type: string
